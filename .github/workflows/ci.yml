name: ci
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q --cov --cov-report=xml --cov-report=term   # fails under 80% (see .coveragerc)
      - run: behave features                                       # BDD acceptance
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.xml }
  integration:                                                      # real Kafka/ClickHouse via Testcontainers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests/integration
  security:
    runs-on: ubuntu-latest
    permissions: { security-events: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: pipx run bandit -r fleetpulse -ll -f json -o bandit.json || true
      - uses: returntocorp/semgrep-action@v1
        with: { config: "p/owasp-top-ten p/python p/jwt" }
      - run: pipx run pip-audit -r requirements.txt
      - run: docker build -t fleetpulse:ci .
      - uses: aquasecurity/trivy-action@0.20.0
        with: { image-ref: fleetpulse:ci, severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }
  dast-and-load:
    needs: [unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && VEHICLES=5000 docker compose up -d --build && sleep 60
      - uses: zaproxy/action-baseline@v0.12.0           # OWASP ZAP against the running API
        with: { target: "http://localhost:8000", fail_action: true }
      - uses: grafana/setup-k6-action@v1
      - run: k6 run -e BASE=http://localhost:8000 loadtest/k6_api.js
      - run: bash loadtest/chaos_kill_broker.sh
